# PVM host kernel cmdline for hosts whose vCPUs mask FSGSBASE/RDTSCP.
#
# Install to /etc/default/grub.d/99-pvm-host.cfg, then run `update-grub`
# (or `grub-mkconfig -o /boot/grub/grub.cfg`) and reboot.
# Verify after reboot:  grep -o 'pti=off\|fred=off\|spectre_v2=off' /proc/cmdline
#
# Why each flag is required — see provisioning/README.md:
#   pti=off        kvm-pvm refuses to load under KPTI (switcher limitation)
#   fred=off       kvm-pvm refuses to load under FRED (not supported yet)
#   spectre_v2=off avoids an RSB-fill-on-VM-exit int3 host crash observed on
#                  a nested, feature-masked host (host-specific; see
#                  skills/references/runtime-fixes.md) — the known-good
#                  configuration for this host class
#
# GRUB_CMDLINE_LINUX (not ..._DEFAULT) is deliberate: it applies to every
# menu entry including recovery mode, so a recovery boot of one of these
# hosts does not silently come up with default mitigations.
#
# SECURITY TRADEOFF: these flags disable Meltdown/Spectre-v2 host
# mitigations. Apply them ONLY to dedicated PVM hosts of this class.

GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX pti=off fred=off spectre_v2=off"
